name: Build Userscript

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP '// @version\s+\K[0-9.]+' yt-zen.user.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building userscript version: $VERSION"

      - name: Validate syntax and metadata
        run: |
          node -c yt-zen.user.js
          node -c src/*.js

          HEADER_VERSION=$(grep -oP '// @version\s+\K[0-9.]+' yt-zen.user.js)
          META_VERSION=$(grep -oP '// @version\s+\K[0-9.]+' yt-zen.meta.js)
          if [ "$HEADER_VERSION" != "$META_VERSION" ]; then
            echo "ERROR: yt-zen.user.js version ($HEADER_VERSION) does not match yt-zen.meta.js version ($META_VERSION)"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp yt-zen.user.js dist/yt-zen.user.js
          cp yt-zen.meta.js dist/yt-zen.meta.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-zen-userscript-v${{ steps.version.outputs.version }}
          path: |
            dist/yt-zen.user.js
            dist/yt-zen.meta.js

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/yt-zen.user.js
            dist/yt-zen.meta.js
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}