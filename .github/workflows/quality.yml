name: Quality

on:
  push:
    branches: [main, 'chore/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test

  sponsorblock-live:
    name: SponsorBlock transport smoke test
    runs-on: ubuntu-latest
    needs: deterministic
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify official API paths
        run: node scripts/test-sponsorblock.js JQb9eGeclQw
