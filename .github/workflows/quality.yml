name: Quality

on:
  push:
    branches: [main, 'chore/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Verify bundle matches sources
        run: git diff --exit-code -- yt-zen.user.js

  sponsorblock-live:
    name: SponsorBlock transport smoke test
    runs-on: ubuntu-latest
    needs: deterministic
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify official API paths
        run: node scripts/test-sponsorblock.js JQb9eGeclQw
