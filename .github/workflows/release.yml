name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install + test
        run: |
          npm ci
          npm test
      - name: Check version tag matches package.json
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v${TAG} does not match package.json version ${PKG}" >&2
            exit 1
          fi
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YT-zen ${GITHUB_REF#refs/tags/v}" \
            --notes "Release for the YT-zen userscript.

Install: use yt-zen.user.js with Tampermonkey/Violentmonkey (auto-updates via updateURL)." \
            yt-zen.user.js \
            yt-zen.meta.js
