<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 260px;
      margin: 0;
      padding: 16px;
      background: #0f1015;
      color: #f1f1f1;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ff3c73;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #8a8a8a;
    }
    .value {
      font-weight: 500;
      color: #f1f1f1;
    }
    .value.active {
      color: #00e676;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #ff0044, #ff3c73);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.18s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h2>YT-zen</h2>
  <div class="status-card">
    <div class="status-row">
      <span class="label">Extension Status</span>
      <span class="value active">Active</span>
    </div>
    <div class="status-row">
      <span class="label">Version</span>
      <span class="value">1.2.0</span>
    </div>
  </div>
  <button id="open-options">Open Options Page</button>
  <script src="popup.js"></script>
</body>
</html>
